name: Update README cards

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - name: Generate stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                card: stats
                options: username=${{ github.repository_owner }}&rank_icon=github&hide_title=true&show_icons=true&include_all_commits=true&theme=dracula
                path: profile/stats.svg
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit Cards
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add profile/*
                git commit -m "Update README cards" || echo "No changes to commit"
                git push